type AdminMutation {
    venues: AdminVenues!
    events: AdminEvents!
    performers: AdminPerformers!
    articles: AdminArticles!
    tags: AdminTags!
    images: AdminImages!

    # Things to do — attractions with opening hours. See specs/things-to-do.md.
    thingsToDo: AdminThingsToDo!

    # Access to the loaders administrator
    loaders: AdminLoaders!

    # Run CloudWatch Logs Insights queries against the service's log groups.
    logs: AdminLogs!

    # the domain of this server
    domain: String
}

# Generic access to CloudWatch Logs Insights. Start a query, then poll for
# results. This lets admin tools run arbitrary log queries without a
# purpose-built API for each one.
type AdminLogs {
    # Start an Insights query. Returns the query id to poll with results().
    startQuery(input: LogQueryInput!): ID!

    # Get the status and (when complete) results of a started query.
    results(queryId: ID!): LogQueryResult!
}

input LogQueryInput {
    # the Insights query string
    query: String!

    # the log group(s) to query. If omitted, the stage's event log group
    # (/aws/events/vegasful-<stage>) is used.
    logGroups: [String!]

    # the start of the time window. Defaults to 24 hours before 'end'.
    start: AWSDateTime

    # the end of the time window. Defaults to now.
    end: AWSDateTime

    # the maximum number of rows to return.
    limit: Int
}

type LogQueryResult {
    # the query status: Running, Complete, Failed, Cancelled, Timeout, etc.
    status: String!

    # the result rows. Populated once the status is Complete.
    rows: [LogQueryRow!]!

    # statistics about the query execution.
    statistics: LogQueryStatistics
}

# A single result row, a list of field/value pairs as returned by Insights.
type LogQueryRow {
    fields: [LogQueryField!]!
}

type LogQueryField {
    field: String!
    value: String
}

type LogQueryStatistics {
    recordsMatched: Float
    recordsScanned: Float
}

type AdminImages {
    # get a URL where the image can be uploaded.
    upload(input: ImageUpload!): Image!
}

input ImageUpload {
