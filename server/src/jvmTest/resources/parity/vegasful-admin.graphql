    # the list of loaders
    loaders: [AdminLoader!]!

    # get a loader
    loader(id: ID!): AdminLoader!

    # register a new loader
    registerLoader(id: ID!, input: LoaderConfiguration!): AdminLoader!

    # Remove a loader.
    deregister(id: ID!): Boolean!
}

input LoaderConfiguration {
    # the name of the loader
    name: String

    # the id of the module
    module: ID

    # the schedule to run the loader with (optional)
    schedule: String

    # A json string of the configuration that will be passed. Must be a JSON object.
    parameters: String
}

# Represents the code that does the actual loading.
type AdminLoaderModule {
    id: ID!
    name: String!
}

# The configuration of a loader
type AdminLoader {
    # The loader ID (generated)
    id: ID!

    # the name of the loader
    name: String!

    # the code that is run. Can be null if manually.
    module: AdminLoaderModule

    # an optional schedule to run the loader.
    schedule: String

    # Update this loader
    update(input: LoaderConfiguration!): AdminLoader!

    # configuration parameters (a JSON object)
    parameters: String

    # a list of recent loader executions
    recentExecutions: [LoaderExecution!]!

    # retrieve logs of the loader execution
    logs(start: AWSDateTime!, end: AWSDateTime!): [LogEvent!]!

    # execute the loader. Can optionally provide the data for execution
    execute(input: LoaderExecutionInput): Boolean!

    # publish data for a loader. An alternative to writing directly to the bucket.
    publish(input: LoaderPublishInput!): Boolean!

    # publish data for a loader. An alternative to writing directly to the bucket.
    reprocess: Boolean!

    # get the internal data saved with this loader
    readInternalData(key: String!): String

    # save internal data for this loader
    saveInternalData(key: String!, data: String!): Boolean

    # get the last loaded data
    lastLoad: LoaderExecution
}

# Defines a log message
type LogEvent {
    # the timestamp of the log event
    ts: AWSDateTime!

    # the message associated with the event
    message: String
}

input LoaderPublishInput {
    # the data for execution. If not provided, the loader module will run.
    data: String!

    # is the data incomplete? If true, items will NOT be removed based on a diff of the data, and the
    # new data will not become the new cached data.
    incomplete: Boolean
}

input LoaderExecutionInput {
    # logging information for the execution.
    data: String
}

type LoaderExecution {
    # the instant that the load took place
    ts: AWSDateTime!

    # the json that was loaded
    events: String!
}
