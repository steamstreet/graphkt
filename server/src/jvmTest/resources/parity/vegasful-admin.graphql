type AdminThingLayer {
    name: String
    description: String
    tagline: String
    summary: String
    tags: [Tag!]
    images: [Image!]!
    aliases: [String!]
    venue: Venue
    links: [SocialLink!]

    # The opening hours, as the stored JSON. Submitted and returned as a string
    # rather than a nested input hierarchy: the shape gains fields when the
    # verification sweep lands, and a deep GraphQL input would have to move with
    # it through an AppSync deploy each time.
    hours: String

    # Where the hours were read from, as stored JSON. Populated by hand when the
    # record is created so the eventual verification sweep has something to work
    # from; nothing reads it yet.
    hoursSources: String

    typicalDuration: Int
    priceFrom: Int
    ticketsUrl: String
    status: ThingStatus

    # The ranking score of this item. 30 is considered 'ordinary'
    rankingScore: Int

    update(input: ThingUpdateInput!): AdminThingLayer!
}

# The update information. Every field is nullable and absent means "leave
# unchanged"; a blank string clears a nullable field. See the update-input
# clearing convention in specs/content-model.md.
input ThingUpdateInput {
    name: String
    description: String
    tagline: String
    summary: String

    # the venue id
    venue: String

    # the tag ids
    tags: [String!]

    # the image hashes
    images: [String!]

    aliases: [String!]
    links: [SocialLinkInput!]

    # serialized OpeningHours. Rejected with the list of structural problems if
    # it does not parse or does not validate.
    hours: String

    # serialized list of HoursSource
    hoursSources: String

    typicalDuration: Int
    priceFrom: Int
    ticketsUrl: String
    status: ThingStatus
    rankingScore: Int
}

# The lifecycle state of a thing to do.
#
# Values (no inline comments — AppSync rejects `#` inside an enum body):
#   OPEN                — operating normally.
#   CLOSED_TEMPORARILY  — shut for now, still listed.
#   CLOSED_PERMANENTLY  — gone; suppressed from every surface.
enum ThingStatus {
    OPEN
    CLOSED_TEMPORARILY
    CLOSED_PERMANENTLY
}

