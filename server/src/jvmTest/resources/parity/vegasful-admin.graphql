# The verification/lifecycle state of a performer. Admin-only: this drives
# whether a performer is followable and whether high-confidence links to it are
# eligible to trigger notifications. It is deliberately not exposed in the public
# API (unlike VenueStatus, which is useful public information).
#
# Values (no inline comments — AppSync rejects `#` inside an enum body):
#   VERIFIED       — identity confirmed against a trusted source; followable, may notify.
#   UNVERIFIED     — real act, no external corroboration; linked/recommendable, not followable.
#   PENDING_REVIEW — awaiting human adjudication in the admin review queue.
#   DISABLED       — suppressed; not surfaced anywhere.
enum PerformerStatus {
    VERIFIED
    UNVERIFIED
    PENDING_REVIEW
    DISABLED
}

