# Manages access to events
type AdminEvents {
    # get an event by id
    event(id: ID!): AdminEvent!

    # Get the next event for review
    reviewNext: AdminEvent

    # Add a new event.
    add(input: EventUpdateInput!): AdminEvent!

    # get a list of recently updated events for review
    forReview: [Event!]!

    # perform an event merge. Returns the target event.
    # A merge includes the following operations:
    # - copies all aliases from the source and adds them to the target's alias list
    # - updates the parent id of all children of the source events to the target id
    # - deletes the source events (this is a delete, not a disable)
    # this operation may not happen immediately, so don't assume much about the returned entity.
    merge(input: MergeInput!): AdminEvent!

    # Perform enhancement. If apply is true, the enhancement will
    # be applied to the event. Otherwise, a version of the event
    # with the applied data will be returned, but the caller must perform
    # the update.
    enhance(id: ID!, apply: Boolean!): EventUpdate
}

input MergeInput {
    # the event that the sources will be merged into
    target: ID!

    # the list of sources that will be merged into the target.
    sources: [ID!]!
}

type AdminEvent {
    id: ID!

    layers: [AdminEventLayer!]!
    layer(id: ID!): AdminEventLayer

    local: AdminEventLayer!
    resolved: Event!

    # Get the parent event. Can be null.
    parent: Event

    # The list of children for this event
    children: [Event!]!

    # submit a review of this event. Returns the next event to review
    review(input: EventUpdateInput!): String

    # submit a message to rebuild the event
    rebuild(message: String): Boolean!

    # disable or delete an event
    disable(delete: Boolean!): Boolean!

    # the timestamp that this event was deactivated. null if still active.
    deactivatedTs: AWSDateTime

    # the timestamp that this event was most recently activated. null if inactive.
    activatedTs: AWSDateTime

    # Generate a new AI-rendered social media slide image for this event and
    # upload it to the media CDN. Each call generates a new variation; previous
    # uploads are kept. Returns the URL where the image can be viewed and
    # downloaded.
    #
    # `dateStyle` controls how the event's date is rendered in the slide
    # prompt: DEFAULT (full "Fri, May 25, 2026"), TODAY, TONIGHT, or
    # DAY_OF_WEEK ("FRIDAY"). Defaults to DEFAULT.
    #
    # `omitTime` drops the "at HH:MM" suffix from the date line. Defaults
    # to false.
    #
    # `includeTagline` controls whether the event's tagline is included in
    # the prompt. Defaults to true (matches the previous unconditional
    # behavior).
    #
    # `includeVenue` controls whether the event's venue is referenced at
    # all: both the "Venue: <name>" line in the prompt and the venue's
    # primary image (used as a reference image alongside the event image).
    # Set to false for single-venue slideshows where repeated venue
    # branding would be distracting. Defaults to true.
    #
    # `renderer` chooses the generation backend. OPENAI_GPT_IMAGE_2 (gpt-image-2)
    # and GEMINI_NANO_BANANA_PRO (gemini-3-pro-image) both run via SlideshowService
    # — slower (~15-30s) and non-deterministic, useful for bespoke/creative slides.
    # TEMPLATE uses the deterministic Java2D template renderer — sub-second,
    # brand-consistent, recommended for bulk production. No default: callers must
    # opt in.
    #
    # `forceCover` (TEMPLATE only) bypasses the wide-aspect letterbox
    # heuristic and always uses cover-fit + center-crop, regardless of the
    # source image's proportions. Use when the heuristic mis-classifies a
    # particular event's promo image. Ignored by the AI renderer.
    generateSocialImage(
        renderer: SocialImageRenderer!,
        dateStyle: SocialImageDateStyle! = DEFAULT,
        omitTime: Boolean! = false,
        includeTagline: Boolean! = true,
        includeVenue: Boolean! = true,
        forceCover: Boolean! = false,
    ): String!

    # Check the status of a previously-started social-image generation. `url`
    # is the URL string returned by generateSocialImage. The server inspects
    # the corresponding S3 objects (the PNG and its .error.txt sibling) and
    # reports back. No state is persisted on the server — the URL is the only
    # handle.
    socialImageStatus(url: String!): SocialImageStatus!
}

# Status of an in-flight or completed social-image generation.
type SocialImageStatus {
    state: SocialImageState!

    # The viewable PNG URL. Populated only when state is READY. Identical to
    # the input `url` argument in that case; null otherwise.
    url: String

    # Populated when state is FAILED. The `error` field from the JSON body of
    # the `.error.txt` sibling. Null otherwise.
    error: String
}

# PENDING: neither the PNG nor an error sibling exists yet — caller should
# poll again.
# READY: the PNG exists at the input URL.
# FAILED: an error sibling exists; the `error` field on SocialImageStatus is
# populated.
enum SocialImageState {
    PENDING,
    READY,
    FAILED
}

# Controls how the event date is rendered in the social-image prompt.
# DEFAULT: full date, e.g. "Fri, May 25, 2026".
# TODAY: literal "TODAY".
# TONIGHT: literal "TONIGHT".
# DAY_OF_WEEK: just the weekday name, e.g. "FRIDAY".
enum SocialImageDateStyle {
    DEFAULT,
    TODAY,
    TONIGHT,
    DAY_OF_WEEK
}

# Selects the social-image generation backend.
# OPENAI_GPT_IMAGE_2: gpt-image-2 via SlideshowService — slow, non-deterministic, creative.
# GEMINI_NANO_BANANA_PRO: Gemini gemini-3-pro-image (nano banana 2) via
#   SlideshowService — slow, non-deterministic, creative.
# TEMPLATE: deterministic Java2D template renderer — fast, brand-consistent.
enum SocialImageRenderer {
    OPENAI_GPT_IMAGE_2,
    GEMINI_NANO_BANANA_PRO,
    TEMPLATE
}

